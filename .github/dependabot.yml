version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(github-actions)
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: sunday
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(nuget)
