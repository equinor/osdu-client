name: Release Please

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write # Required to update changelog file
      pull-requests: write # Required to create release PRs
    uses: equinor/ops-actions/.github/workflows/release-please-manifest.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # v9.44.0

  publish-nuget:
    name: Publish NuGet Package
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: read # Required to checkout code
      packages: write # Required to publish packages to GitHub Packages
    uses: ./.github/workflows/publish-nuget.yml
    with:
      release-path: ${{ needs.release-please.outputs.paths_released }}
